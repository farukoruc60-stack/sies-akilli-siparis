services:
  - type: web
    name: sies-akilli-siparis-api
    env: node
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USE_POSTGRES
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sies-postgres-db
          property: connectionString

databases:
  - name: sies-postgres-db
    databaseName: sies_order_db
    user: sies_user
